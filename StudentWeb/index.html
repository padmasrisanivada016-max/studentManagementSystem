<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Manager</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 30px auto; padding: 0 15px; }
    h1 { color: #2c3e50; }
    form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    input { padding: 8px; flex: 1; min-width: 150px; }
    button { padding: 8px 14px; cursor: pointer; border: none; border-radius: 4px; background: #3498db; color: white; }
    button.delete { background: #e74c3c; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f4f6f8; }
  </style>
</head>
<body>
  <h1>🎓 Student Manager</h1>

  <form id="studentForm">
    <input id="name" placeholder="Name" required>
    <input id="email" type="email" placeholder="Email" required>
    <input id="course" placeholder="Course" required>
    <button type="submit">Add Student</button>
  </form>

  <table>
    <thead>
      <tr><th>ID</th><th>Name</th><th>Email</th><th>Course</th><th>Actions</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script>
    const API = "http://localhost:8081/api/students";

    // Ask the window for all students and draw them in the table
    async function loadStudents() {
      const res = await fetch(API);
      const students = await res.json();
      const body = document.getElementById("rows");
      body.innerHTML = "";

      students.forEach(s => {
        const tr = document.createElement("tr");

        [s.id, s.name, s.email, s.course].forEach(value => {
          const td = document.createElement("td");
          td.textContent = value;
          tr.appendChild(td);
        });

        const actions = document.createElement("td");

        const editBtn = document.createElement("button");
        editBtn.textContent = "Edit course";
        editBtn.onclick = () => editCourse(s);

        const delBtn = document.createElement("button");
        delBtn.textContent = "Delete";
        delBtn.className = "delete";
        delBtn.onclick = () => deleteStudent(s.id);

        actions.append(editBtn, " ", delBtn);
        tr.appendChild(actions);
        body.appendChild(tr);
      });
    }

    // Add a student
    document.getElementById("studentForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const student = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        course: document.getElementById("course").value
      };
      await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(student)
      });
      e.target.reset();
      loadStudents();
    });

    // Change a student's course
    async function editCourse(student) {
      const newCourse = prompt("New course for " + student.name + ":", student.course);
      if (!newCourse) return;
      await fetch(API + "/" + student.id, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...student, course: newCourse })
      });
      loadStudents();
    }

    // Delete a student
    async function deleteStudent(id) {
      await fetch(API + "/" + id, { method: "DELETE" });
      loadStudents();
    }

    loadStudents();
  </script>
</body>
</html>
